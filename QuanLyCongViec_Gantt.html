<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phần mềm Quản lý công việc & Gantt - Thầy Đạt Tin Học</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230d9488%22%2F%3E%3Cpath%20d%3D%22M9%2010h14M9%2016h14M9%2022h9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0d9488;--p-d:#0f766e;--p-50:#f0fdfa;--p-100:#ccfbf1;--ink:#042f2e;--ink2:#134e4a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Lexend','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1f2937;background:#f3f5f9;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p-d)}
svg{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Khung ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--ink),var(--ink2));color:#e5e7eb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.25}
.brand small{color:rgba(255,255,255,.55);font-size:12px}
.nav{flex:1;overflow:auto;padding:6px 10px 12px}
.nav-group{margin:16px 12px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;cursor:pointer;font-weight:500;margin:2px 0;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav a svg{width:18px;height:18px;opacity:.9}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.save-state{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.save-state i{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.save-state.dirty i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.btn-save{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;transition:.15s}
.btn-save:hover{background:var(--p-100)}
.btn-save svg{width:17px;height:17px}
.credit{font-size:11px;color:rgba(255,255,255,.38);margin-top:12px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid #e3e7ef;min-height:70px}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:#6b7280;font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.content{padding:22px 28px 48px}
.menu-btn{display:none}
.backdrop{display:none}

/* ===== Nút, ô nhập ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #d6dce7;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s;text-decoration:none;color:#1f2937}
.btn:hover{border-color:var(--p);color:var(--p-d)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-d);border-color:var(--p-d);color:#fff}
.btn.xl{background:#15803d;border-color:#15803d;color:#fff}
.btn.xl:hover{background:#166534;color:#fff}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--p-50);border-color:var(--p);color:var(--p-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:#667085;vertical-align:middle}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{background:var(--p-50);color:var(--p-d)}
.ibtn.del:hover{background:#fee2e2;color:#dc2626}
.inp{height:36px;border:1px solid #d6dce7;border-radius:9px;padding:0 11px;background:#fff;outline:none;min-width:0;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-100)}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
select.inp{padding-right:28px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px;padding:0 8px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative;display:inline-flex}
.search input{padding-left:34px;width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#98a2b3}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:#475467}
.seg button.on{background:#fff;color:var(--p-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ===== Bố cục, thẻ ===== */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:#667085}
.small{font-size:12.5px}
.r{text-align:right}.c{text-align:center}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.pos{color:#15803d}.neg{color:#dc2626}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--p-50);opacity:.6}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--p-50);color:var(--p);position:relative;z-index:1}
.kpi .k-ic svg{width:19px;height:19px}
.kpi .k-lb{color:#667085;font-size:12.5px;font-weight:500;margin-top:12px}
.kpi .k-v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:12px;color:#667085;margin-top:3px}
.t-green .k-ic{background:#dcfce7;color:#16a34a}
.t-red .k-ic{background:#fee2e2;color:#dc2626}
.t-amber .k-ic{background:#fef3c7;color:#d97706}
.t-blue .k-ic{background:#dbeafe;color:#2563eb}
.t-violet .k-ic{background:#ede9fe;color:#7c3aed}
.t-cyan .k-ic{background:#cffafe;color:#0891b2}
.card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eef0f5;min-height:56px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{color:#667085;font-size:12.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-b.p0{padding:0}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--p-50);border:1px solid var(--p-100);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:#fffbeb;border-color:#fde68a}
.banner svg{width:20px;height:20px;color:var(--p)}
.banner.warn svg{color:#d97706}
.empty{padding:40px 20px;text-align:center;color:#98a2b3}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f2f4f7;color:#475467;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-violet{background:#ede9fe;color:#6d28d9}
.b-cyan{background:#cffafe;color:#0e7490}
.b-p{background:var(--p-50);color:var(--p-d)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p-100);color:var(--p-d);font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{color:#667085;font-size:12px}

/* ===== Bảng ===== */
.tbl-card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
.tbl-tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f5;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:200px}
.tbl-wrap.free{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-weight:700;color:#475467;padding:10px 12px;border-bottom:1px solid #e3e7ef;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tbody tr:hover td{background:var(--p-50)}
.tbl tbody tr.click{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.c,.tbl td.c{text-align:center}
.tbl tfoot td{font-weight:700;background:#f7f9fc;border-top:2px solid #e3e7ef;position:sticky;bottom:0;z-index:2}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:after{content:'↕';opacity:.3;margin-left:5px}
.tbl th.asc:after{content:'↑';opacity:1}
.tbl th.desc:after{content:'↓';opacity:1}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl-pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:#667085;gap:10px;flex-wrap:wrap}
.tbl .inp.sm{width:110px}
.pg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg select{margin:0 8px 0 4px}
.pg-n{min-width:30px;height:30px;padding:0 8px;border:1px solid #d6dce7;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:#475467}
.pg-n:hover:not(:disabled){border-color:var(--p);color:var(--p-d)}
.pg-n.on{background:var(--p);border-color:var(--p);color:#fff}
.pg-n:disabled{opacity:.4;cursor:default}
.pg-dot{padding:0 4px;color:#98a2b3}
.pg-host .tbl-pager{border-top:1px solid #eef0f5}
.tbl.compact td{padding:7px 10px}
.tbl.compact th{padding:8px 10px}

/* ===== Modal, form ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #eef0f5}
.modal-h h3{margin:0;font-size:16px}
.modal-h .ibtn{margin-left:auto}
.modal-b{padding:18px 20px;max-height:72vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid #eef0f5;background:#fafbfc;border-radius:0 0 16px 16px}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:#344054}
.field.full{grid-column:1/-1}
.field.s2{grid-column:span 2}
.field small{color:#98a2b3;font-size:11.5px}
.field .inp{width:100%}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.req{color:#ef4444;font-style:normal}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p-d);border-bottom:1px solid #eef0f5;padding-bottom:6px;margin-top:6px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .ph{width:72px;height:72px;border-radius:12px;border:1px dashed #cbd2dd;display:grid;place-items:center;overflow:hidden;background:#f8fafc;color:#98a2b3;flex:none}
.img-pick .ph img{width:100%;height:100%;object-fit:contain}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f2f4f7;display:block}

/* ===== Thông báo, gợi ý ===== */
#toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:400px;animation:pop .2s;border-left:4px solid var(--p)}
.toast.ok{border-left-color:#22c55e}
.toast.err{border-left-color:#ef4444}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:400;white-space:pre;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}

/* ===== Biểu đồ ===== */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#475467;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px}
.dl{flex:1;min-width:170px}
.dl div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef0f5;font-size:13px}
.dl div:last-child{border-bottom:0}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl em{color:#98a2b3;font-style:normal;width:48px;text-align:right;font-size:12px}
.hb{margin:10px 0}
.hb-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.hb-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-bar{height:8px;background:#f0f2f6;border-radius:99px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px;background:var(--p)}
.funnel .fn{display:flex;align-items:center;gap:12px;margin:8px 0}
.funnel .fn-l{width:130px;font-size:13px;flex:none}
.funnel .fn-b{flex:1;height:30px;background:#f3f5f9;border-radius:8px;overflow:hidden}
.funnel .fn-b i{display:flex;align-items:center;height:100%;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:0 10px;min-width:34px}

/* ===== Màn hình nhỏ ===== */
@media(max-width:1100px){.cols-2,.cols-3,.cols-21,.cols-12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap;position:static}
  .top-actions{margin-left:0;width:100%;justify-content:flex-start}
  .content{padding:16px}
  .search input{width:200px}
  .form,.form.c3,.form.c4{grid-template-columns:minmax(0,1fr)}
  .field.s2{grid-column:auto}
}

/* ===== In ===== */
#print-root{display:none}
.pr{color:#111;font-size:12px;font-family:'Lexend','Segoe UI',Arial,sans-serif}
.pr-head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:10px;margin-bottom:12px}
.pr-head img{max-height:58px;max-width:120px}
.pr-co b{font-size:15px;color:var(--p-d);text-transform:uppercase}
.pr-co div{font-size:11.5px;color:#444}
.pr-meta{margin-left:auto;text-align:right;font-size:11px;color:#555}
.pr h2{text-align:center;margin:12px 0 4px;font-size:19px;text-transform:uppercase;color:#111;letter-spacing:.02em}
.pr .pr-sub{text-align:center;color:#555;margin-bottom:14px;font-style:italic}
.pr table{width:100%;border-collapse:collapse}
.pr th{background:var(--p);color:#fff;padding:6px;font-size:10.5px;border:1px solid var(--p-d);text-align:center}
.pr td{border:1px solid #c9ced8;padding:5px 6px;font-size:11px;vertical-align:top}
.pr td.r{text-align:right;white-space:nowrap}
.pr td.c{text-align:center}
.pr tfoot td{font-weight:700;background:#eef1f6}
.pr-signs{display:flex;justify-content:space-around;margin-top:26px;text-align:center;page-break-inside:avoid}
.pr-signs div{min-width:150px}
.pr-signs b{display:block}
.pr-signs i{font-size:11px;color:#666}
.pr-signs .sp{height:72px}
.pr-note{margin-top:10px;font-size:11.5px}
.pagebreak{page-break-after:always;break-after:page}
@media print{
  body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.is-printing>*:not(#print-root){display:none!important}
  body.is-printing #print-root{display:block}
  body:not(.is-printing) .sidebar,body:not(.is-printing) .topbar,body:not(.is-printing) .no-print{display:none!important}
  body:not(.is-printing) .content{padding:0}
  .card,.kpi,.tbl-card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  #print-root .card{border:1px solid #ddd}
  #print-root .kpis{grid-template-columns:repeat(3,1fr)}
  #print-root .cols-2,#print-root .cols-21,#print-root .cols-12{grid-template-columns:1fr 1fr}
  #print-root .no-print,#print-root .tbl-tools,#print-root .tbl-pager,#print-root td.act,#print-root th.act{display:none!important}
}


/* ===== Bản của Thầy Đạt ===== */
.side-top{padding:12px 14px 4px;border-bottom:1px solid rgba(255,255,255,.08)}

'use strict';
/* ==========================================================
   LÕI DÙNG CHUNG - Thầy Đạt Tin Học
   Giao diện, lưu đè file, xuất Excel (.xlsx), in, biểu đồ
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const sum = (arr, f) => arr.reduce((s, x) => s + (+(f ? f(x) : x) || 0), 0);
const round = n => Math.round(+n || 0);
const by = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m[k] = m[k] || []).push(x); return m; }, {});
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Định dạng ---------- */
const F = {
  money(n) { return round(n).toLocaleString('vi-VN'); },
  vnd(n) { return F.money(n) + ' đ'; },
  num(n, d = 1) { return (+n || 0).toLocaleString('vi-VN', { maximumFractionDigits: d }); },
  pct(n, d = 1) { return F.num(n, d) + '%'; },
  short(n) {
    n = +n || 0; const a = Math.abs(n);
    const f = (v, u) => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toLocaleString('vi-VN') + u;
    if (a >= 1e9) return f(n / 1e9, ' tỷ');
    if (a >= 1e6) return f(n / 1e6, ' tr');
    if (a >= 1e3) return f(n / 1e3, 'k');
    return String(round(n));
  },
  date(s) { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : s; },
  month(ym) { if (!ym) return ''; const [y, m] = ym.split('-'); return `Tháng ${+m}/${y}`; },
  mshort(ym) { const [y, m] = ym.split('-'); return `T${+m}/${String(y).slice(2)}`; },
  parse(v) { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[^\d-]/g, ''); return s && s !== '-' ? parseInt(s, 10) : 0; },
  initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p.length > 1 ? p[p.length - 2][0] : '') + p[p.length - 1][0]).toUpperCase(); }
};

/* ---------- Ngày tháng ---------- */
const D = {
  iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
  today() { return D.iso(new Date()); },
  parse(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d || 1); },
  add(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },
  diff(a, b) { return Math.round((D.parse(a) - D.parse(b)) / 864e5); },
  ymNow() { return D.today().slice(0, 7); },
  ymAdd(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); },
  ymRange(endYm, count) { const out = []; for (let i = count - 1; i >= 0; i--) out.push(D.ymAdd(endYm, -i)); return out; },
  daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  dow(ym, d) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, d).getDay(); },
  serial(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; },
  dowName: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7']
};

/* ---------- Đọc số thành chữ ---------- */
function docSo(n) {
  n = Math.round(Math.abs(+n || 0));
  if (n === 0) return 'Không đồng';
  const cs = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const doc3 = (x, full) => {
    const tr = Math.floor(x / 100), ch = Math.floor(x % 100 / 10), dv = x % 10; let s = '';
    if (full || tr > 0) s += cs[tr] + ' trăm';
    if (ch > 1) { s += ' ' + cs[ch] + ' mươi'; if (dv === 1) s += ' mốt'; else if (dv === 5) s += ' lăm'; else if (dv === 4) s += ' tư'; else if (dv > 0) s += ' ' + cs[dv]; }
    else if (ch === 1) { s += ' mười'; if (dv === 5) s += ' lăm'; else if (dv > 0) s += ' ' + cs[dv]; }
    else if (dv > 0) { if (full || tr > 0) s += ' lẻ'; s += ' ' + cs[dv]; }
    return s.trim();
  };
  const g = []; let t = n; while (t > 0) { g.push(t % 1000); t = Math.floor(t / 1000); }
  let out = [];
  for (let i = g.length - 1; i >= 0; i--) { if (g[i] === 0) continue; out.push(doc3(g[i], i !== g.length - 1) + units[i]); }
  const s = out.join(' ').replace(/\s+/g, ' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

/* ---------- Số ngẫu nhiên có hạt giống (dữ liệu mẫu) ---------- */
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const Sample = {
  ho: ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Huỳnh', 'Phan', 'Vũ', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương', 'Lý'],
  demNam: ['Văn', 'Minh', 'Đức', 'Quốc', 'Hữu', 'Thành', 'Gia', 'Anh', 'Công', 'Tuấn'],
  demNu: ['Thị', 'Ngọc', 'Thu', 'Thanh', 'Minh', 'Phương', 'Kim', 'Bảo', 'Mai', 'Hồng'],
  tenNam: ['Hùng', 'Dũng', 'Nam', 'Long', 'Phúc', 'Khang', 'Bảo', 'Huy', 'Tùng', 'Sơn', 'Hiếu', 'Thắng', 'Quân', 'Trung', 'Đạt', 'Khoa'],
  tenNu: ['Lan', 'Hương', 'Trang', 'Linh', 'Ngân', 'Thảo', 'Hà', 'Vy', 'Yến', 'Mai', 'Nhung', 'Hạnh', 'Quyên', 'Châu', 'Oanh', 'Diệp'],
  pick(r, a) { return a[Math.floor(r() * a.length)]; },
  name(r, nu) { return nu === undefined ? Sample.name(r, r() < .5) : [Sample.pick(r, Sample.ho), Sample.pick(r, nu ? Sample.demNu : Sample.demNam), Sample.pick(r, nu ? Sample.tenNu : Sample.tenNam)].join(' '); },
  phone(r) { return '09' + String(Math.floor(r() * 1e8)).padStart(8, '0'); },
  int(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
};

/* ---------- Biểu tượng ---------- */
const ICONS = {

const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

/* ---------- Hành động (bấm nút có data-act) ---------- */
const ACT = {};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(b.dataset, b, e); }
});

/* ---------- Thông báo, gợi ý chuột ---------- */
function rootEl(id, tag = 'div') {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement(tag); el.id = id; el.dataset.runtime = '1'; document.body.appendChild(el); }
  return el;
}
function toast(msg, type = '', ms = 3200) {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.innerHTML = msg;
  rootEl('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, ms);
}
(function tipInit() {
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    const tip = rootEl('tip');
    if (!el) { tip.style.display = 'none'; return; }
    tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    const tip = document.getElementById('tip'); if (!tip || tip.style.display !== 'block') return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - h - 10;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
})();

/* ---------- Modal, xác nhận ---------- */
const Modal = {
  open({ title, body = '', width = 640, foot = '', onClose }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap'; wrap.dataset.runtime = '1';
    wrap.innerHTML = `<div class="modal" style="max-width:${width}px"><div class="modal-h"><h3>${title}</h3><button class="ibtn" data-x>${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); document.removeEventListener('keydown', key); onClose && onClose(); };
    const key = e => { if (e.key === 'Escape' && document.querySelector('.modal-wrap:last-of-type') === wrap) close(); };
    document.addEventListener('keydown', key);
    wrap.querySelector('[data-x]').onclick = close;
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) wrap._down = true; });
    wrap.addEventListener('mouseup', e => { if (e.target === wrap && wrap._down) close(); wrap._down = false; });
    const f = wrap.querySelector('input:not([type=hidden]),select,textarea');
    if (f) setTimeout(() => f.focus(), 30);
    return { el: wrap, close, body: wrap.querySelector('.modal-b') };
  },
  confirm(msg, { ok = 'Đồng ý', danger = false, title = 'Xác nhận' } = {}) {
    return new Promise(res => {
      let done = false;
      const m = Modal.open({ title, width: 440, body: `<div style="font-size:14px">${msg}</div>`, foot: `<button class="btn" data-no>Hủy</button><button class="btn ${danger ? 'danger' : 'pri'}" data-ok>${ok}</button>`, onClose: () => { if (!done) res(false); } });
      m.el.querySelector('[data-no]').onclick = () => m.close();
      m.el.querySelector('[data-ok]').onclick = () => { done = true; m.close(); res(true); };
    });
  }
};

/* ---------- Form ---------- */
function optList(o) { return (o || []).map(x => typeof x === 'object' ? x : { value: x, label: x }); }
function fieldHTML(f, v) {
  if (f.type === 'section') return `<div class="fsec">${f.label}</div>`;
  const nm = `name="${f.key}"`, req = f.required ? ' <i class="req">*</i>' : '';
  const cls = 'field' + (f.full ? ' full' : '') + (f.s2 ? ' s2' : '');
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let input;
  v = v ?? f.def ?? '';
  switch (f.type) {
    case 'select': input = `<select class="inp" ${nm}>${f.blank ? `<option value="">${f.blank}</option>` : ''}${optList(typeof f.options === 'function' ? f.options() : f.options).map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`; break;
    case 'textarea': input = `<textarea class="inp" ${nm} rows="${f.rows || 3}"${ph}>${esc(v)}</textarea>`; break;
    case 'money': input = `<input class="inp num" ${nm} data-money inputmode="numeric" value="${v === '' ? '' : F.money(v)}"${ph}>`; break;
    case 'number': input = `<input class="inp num" type="number" step="${f.step || 'any'}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${nm} value="${esc(v)}"${ph}>`; break;
    case 'checkbox': return `<label class="${cls} chk"><input type="checkbox" ${nm} ${v ? 'checked' : ''}> <span>${f.label}</span></label>`;
    case 'image': return `<div class="${cls}"><span>${f.label}</span><div class="img-pick"><div class="ph" data-ph>${v ? `<img src="${v}">` : ic('upload')}</div><div class="row"><label class="btn sm">${ic('upload')} Chọn ảnh<input type="file" accept="image/*" hidden data-img="${f.key}" data-max="${f.max || 240}"></label><button type="button" class="btn sm" data-imgclear="${f.key}">Bỏ ảnh</button></div><input type="hidden" ${nm} data-image value="${esc(v)}"></div>${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
    default: input = `<input class="inp" type="${f.type || 'text'}" ${nm} value="${esc(v)}"${ph}${f.list ? ` list="dl_${f.key}"` : ''}>${f.list ? `<datalist id="dl_${f.key}">${(typeof f.list === 'function' ? f.list() : f.list).map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;

const Print = {
  run(html, { landscape = false, title } = {}) {
    $$('#print-root,#print-page').forEach(n => n.remove());
    const root = document.createElement('div'); root.id = 'print-root'; root.dataset.runtime = '1'; root.innerHTML = html;
    document.body.appendChild(root);
    const st = document.createElement('style'); st.id = 'print-page'; st.dataset.runtime = '1';
    st.textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:11mm 10mm}`;
    document.head.appendChild(st);
    document.body.classList.add('is-printing');
    const t0 = document.title; if (title) document.title = title;
    const done = () => { document.body.classList.remove('is-printing'); root.remove(); st.remove(); document.title = t0; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('is-printing')) done(); }, 800); }, 120);
  },
  head(meta = '') {
    const c = DB.settings.company || {};
    return `<div class="pr-head">${c.logo ? `<img src="${c.logo}">` : ''}<div class="pr-co"><b>${esc(c.ten || '')}</b>${c.diaChi ? `<div>${esc(c.diaChi)}</div>` : ''}<div>${[c.sdt ? 'ĐT: ' + esc(c.sdt) : '', c.email ? 'Email: ' + esc(c.email) : '', c.mst ? 'MST: ' + esc(c.mst) : ''].filter(Boolean).join(' · ')}</div></div><div class="pr-meta">${meta || 'Ngày in: ' + F.date(D.today())}</div></div>`;
  },
  signs(list, date = true) {
    const d = new Date();
    return `${date ? `<div style="text-align:right;margin-top:16px;font-style:italic">Ngày ${d.getDate()} tháng ${d.getMonth() + 1} năm ${d.getFullYear()}</div>` : ''}<div class="pr-signs">${list.map(s => `<div><b>${s}</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>`).join('')}</div>`;
  },
  table(cols, rows, totals = true) {
    const xc = xCols(cols);
    const body = rows.map((r, ri) => `<tr>${xc.map(c => { const v = c._c.xval ? c._c.xval(r) : colText(c._c, r); const t = c.type; return `<td class="${['money', 'num', 'pct'].includes(t) ? 'r' : t === 'date' || t === 'center' ? 'c' : ''}">${t === 'money' ? F.money(v) : t === 'num' ? F.num(v) : t === 'pct' ? F.pct(v) : t === 'date' ? F.date(v) : esc(v)}</td>`; }).join('')}</tr>`).join('');
    const foot = totals && xc.some(c => c.sum) ? `<tfoot><tr>${xc.map((c, i) => `<td class="${c.sum ? 'r' : ''}">${c.sum ? (c.type === 'num' ? F.num(sum(rows, r => colText(c._c, r))) : F.money(sum(rows, r => c._c.xval ? c._c.xval(r) : colText(c._c, r)))) : i === 0 ? 'Tổng cộng' : ''}</td>`).join('')}</tr></tfoot>` : '';

/* ---------- Tính lịch ---------- */
const isWork = s => { const w = D.parse(s).getDay(); return w !== 0 && w !== 6; };
function normStart(s, mode) { if (mode === 'mf') { let i = 0; while (!isWork(s) && i < 7) { s = D.add(s, 1); i++; } } return s; }
function endOf(s, days, mode) {
  days = Math.max(0, Math.round(+days || 0)); if (days <= 1) return s;
  if (mode !== 'mf') return D.add(s, days - 1);
  let d = s, c = 1; while (c < days) { d = D.add(d, 1); if (isWork(d)) c++; } return d;
}
// Ngày bắt đầu và kết thúc thực tế của từng việc (tính cả việc phải chờ việc trước)
function scheduleMap(tasks, mode) {
  const m = {}, memo = {}; tasks.forEach(t => m[t.id] = t);
  const calc = (t, stack) => {
    if (memo[t.id]) return memo[t.id];
    let s = t.start || D.today(); const dep = t.dep && m[t.dep];
    if (dep && !stack.includes(dep.id)) { const d = calc(dep, [...stack, t.id]); const ds = D.add(d.e, 1); if (ds > s) s = ds; }
    s = normStart(s, mode); return memo[t.id] = { s, e: endOf(s, t.days, mode) };
  };
  tasks.forEach(t => calc(t, []));
  return memo;
}
const mode = () => DB.settings.calMode;
const personOf = id => DB.people.find(p => p.id === id);
const pjById = id => DB.projects.find(p => p.id === id);
function curPj() { if (!pjById(UI.pj)) UI.pj = DB.projects[0] ? DB.projects[0].id : ''; return pjById(UI.pj); }
function derive(tasks) {
  const sc = scheduleMap(DB.tasks, mode()), today = D.today();
  return tasks.map(t => {
    const { s, e } = sc[t.id], days = +t.days || 0, pct = Math.max(0, Math.min(100, +t.pct || 0));
    let st; if (pct >= 100) st = 'Hoàn thành'; else if (today > e) st = 'Trễ hạn'; else if (today < s && pct === 0) st = 'Chưa bắt đầu'; else st = 'Đang làm';
    const span = D.diff(e, s) + 1;
    const exp = days === 0 ? (today >= s ? 100 : 0) : Math.round(Math.max(0, Math.min(1, (D.diff(today, s) + 1) / span)) * 100);
    return { ...t, s, e, st, pct, exp, span, ms: days === 0, person: personOf(t.nguoi), behind: st !== 'Hoàn thành' && pct < exp - 15 };
  });
}
const pjTasks = pid => derive(DB.tasks.filter(t => t.pid === pid)).sort((a, b) => a.s.localeCompare(b.s) || a.e.localeCompare(b.e));
function stats(vt) {
  const w = t => t.ms ? 0 : (+t.days || 0), W = sum(vt, w), n = vt.length;
  const prog = W ? sum(vt, t => w(t) * t.pct) / W : (n ? sum(vt, t => t.pct) / n : 0);
  const plan = W ? sum(vt, t => w(t) * t.exp) / W : (n ? sum(vt, t => t.exp) / n : 0);
  const cnt = s => vt.filter(t => t.st === s).length;
  return { n, W, prog, plan, done: cnt('Hoàn thành'), doing: cnt('Đang làm'), late: cnt('Trễ hạn'), todo: cnt('Chưa bắt đầu'), start: n ? vt.reduce((m, t) => t.s < m ? t.s : m, vt[0].s) : '', end: n ? vt.reduce((m, t) => t.e > m ? t.e : m, vt[0].e) : '' };
}
function pctAt(t, d) {
  const today = D.today(); if (d >= today) return t.pct;
  const lg = (t.log || []).filter(x => x[0] <= d).sort((a, b) => a[0].localeCompare(b[0]));
  if (lg.length) return lg[lg.length - 1][1];
  if ((t.log || []).length) return 0;
  if (d < t.s) return 0; return t.pct * Math.min(1, (D.diff(d, t.s) + 1) / Math.max(1, D.diff(today, t.s) + 1));
}
function planAt(t, d) { if (t.ms) return d >= t.s ? 100 : 0; return Math.max(0, Math.min(1, (D.diff(d, t.s) + 1) / t.span)) * 100; }
function wavg(vt, f) { const w = t => t.ms ? 0 : (+t.days || 0), W = sum(vt, w); return W ? sum(vt, t => w(t) * f(t)) / W : (vt.length ? sum(vt, f) / vt.length : 0); }
const stBadge = s => `<span class="badge ${ST_B[s]}">${esc(s)}</span>`;
const priBadge = s => `<span class="badge ${PRI_B[s] || ''}">${esc(s)}</span>`;

function wouldCycle(id, dep) { let k = dep, i = 0; while (k && i++ < 200) { if (k === id) return true; const t = DB.tasks.find(x => x.id === k); k = t ? t.dep : ''; } return false; }

/* ---------- Biểu đồ đường cong tiến độ ---------- */
function sCurve(vt) {
  const st = stats(vt); if (!st.n) return '<div class="empty">Chưa có việc</div>';
  const today = D.today(); let from = st.start, to = st.end > today ? st.end : today;
  const total = D.diff(to, from) + 1, step = Math.max(1, Math.ceil(total / 30)), pts = [];
  for (let k = 0; k < total; k += step) pts.push(D.add(from, k)); if (pts[pts.length - 1] !== to) pts.push(to);
  const W = 640, H = 260, L = 44, R = 16, T = 14, B = 34, iw = W - L - R, ih = H - T - B, n = pts.length;
  const X = i => L + (n === 1 ? iw / 2 : iw * i / (n - 1)), Y = v => T + ih - ih * Math.max(0, Math.min(100, v)) / 100;
  let g = '';
  for (let k = 0; k <= 4; k++) { const y = T + ih - ih * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#eef0f5" ${k ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#98a2b3">${k * 25}%</text>`; }
  const every = Math.ceil(n / 8); pts.forEach((d, i) => { if (i % every === 0) g += `<text x="${X(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#667085">${F.date(d).slice(0, 5)}</text>`; });
  const plan = pts.map(d => wavg(vt, t => planAt(t, d))), act = pts.map(d => d <= today ? wavg(vt, t => pctAt(t, d)) : null);
  g += `<polyline points="${plan.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>`;
  const ai = act.map((v, i) => v === null ? null : [X(i), Y(v)]).filter(Boolean);
  if (ai.length) g += `<polygon points="${ai[0][0]},${T + ih} ${ai.map(p => p.join(',')).join(' ')} ${ai[ai.length - 1][0]},${T + ih}" fill="${THEME.p}" opacity=".12"/><polyline points="${ai.map(p => p.join(',')).join(' ')}" fill="none" stroke="${THEME.p}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((d, i) => { if (act[i] !== null) g += `<circle cx="${X(i)}" cy="${Y(act[i])}" r="4" fill="#fff" stroke="${THEME.p}" stroke-width="2" data-tip="${F.date(d)}\nThực tế: ${F.pct(act[i])}\nKế hoạch: ${F.pct(plan[i])}"/>`; else g += `<circle cx="${X(i)}" cy="${Y(plan[i])}" r="3" fill="#fff" stroke="#94a3b8" stroke-width="2" data-tip="${F.date(d)}\nKế hoạch: ${F.pct(plan[i])}"/>`; });
  const ti = pts.findIndex(d => d >= today); if (ti >= 0) g += `<line x1="${X(ti)}" x2="${X(ti)}" y1="${T}" y2="${T + ih}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(ti)}" y="${T + 10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309" dy="-3">Hôm nay</text>`;
  return `<div class="chart sc"><div class="legend"><span><i style="background:${THEME.p}"></i>Thực tế</span><span><i style="background:#94a3b8"></i>Kế hoạch</span></div><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

      ${rows.length ? `<div class="gt-wrap"><div class="gt-scroll" id="gtScroll">${left}<div class="gt-right"><svg id="gtSvg" width="${built.W}" height="${built.H}" viewBox="0 0 ${built.W} ${built.H}" data-a="${range.a}" data-dw="${dw}" data-drag="${UI.g.zoom !== 'month' ? 1 : 0}">${built.svg}</svg></div></div></div><p class="muted small" style="margin:10px 2px 0">Mẹo: thanh đậm là phần đã làm, thanh nhạt là phần còn lại. Việc trễ hạn có viền đỏ. Dấu ⚠ là việc đang chậm hơn kế hoạch.</p>` : '<div class="empty">Chưa có công việc nào phù hợp</div>'}`;
    onVal('whoF', v => { UI.who = v; App.render(); });
    const sc = $('#gtScroll'); if (sc) { sc.scrollLeft = Math.max(0, built.tx - 260); bindGantt($('#gtSvg'), pj); }
  },
  excel() { const pj = curPj(); if (pj) XLSX.save('Gantt ' + pj.ten, [ganttSheet(pj)]); },
  print() {
    const pj = curPj(); if (!pj) return; const vt = pjTasks(pj.id), rows = ganttRows(vt), range = ganttRange(rows, vt);
    const LW = 330, TW = Math.max(700, 1180 - LW), dw = Math.min(26, TW / range.n);
    const b = ganttSVG(rows, { range, dw, zoom: dw >= 14 ? 'day' : dw >= 6 ? 'week' : 'month', noDep: false, ox: LW });
    let left = `<rect x="0" y="0" width="${LW}" height="${b.H}" fill="#fff"/><rect x="0" y="0" width="${LW}" height="${HEAD_H}" fill="#eef1f6"/><text x="8" y="${HEAD_H - 10}" font-size="12" font-weight="700" fill="#344054">CÔNG VIỆC</text><text x="${LW - 112}" y="${HEAD_H - 10}" font-size="12" font-weight="700" fill="#344054">PHỤ TRÁCH</text><text x="${LW - 8}" y="${HEAD_H - 10}" text-anchor="end" font-size="12" font-weight="700" fill="#344054">%</text>`;
    rows.forEach((r, i) => { const y = HEAD_H + i * ROW_H + 21; left += r.type === 'g' ? `<rect x="0" y="${HEAD_H + i * ROW_H}" width="${LW}" height="${ROW_H}" fill="#f3f6fa"/><text x="8" y="${y}" font-size="12" font-weight="700" fill="#1f2937">${esc(r.name)}</text><text x="${LW - 8}" y="${y}" text-anchor="end" font-size="12" font-weight="700" fill="#0f766e">${F.num(r.pct, 0)}%</text>` : `<text x="18" y="${y}" font-size="12" fill="#1f2937">${esc(r.t.ten.length > 30 ? r.t.ten.slice(0, 29) + '…' : r.t.ten)}</text><text x="${LW - 112}" y="${y}" font-size="11" fill="#475467">${esc(r.t.person ? r.t.person.ten.split(' ').slice(-2).join(' ') : '-')}</text><text x="${LW - 8}" y="${y}" text-anchor="end" font-size="12" fill="#1f2937">${r.t.pct}%</text>`; });
    const W = LW + b.W;
    Print.run(`<div class="pr">${Print.head()}<h2>Biểu đồ Gantt</h2><div class="pr-sub">${esc(pj.ten)} · In ngày ${F.date(D.today())}</div><div class="prn-gantt"><svg viewBox="0 0 ${W} ${b.H}" width="${W}" height="${b.H}">${left}<g transform="translate(${LW},0)">${b.svg}</g></svg></div><div class="pr-note">Thanh đậm: phần đã hoàn thành · Thanh nhạt: phần còn lại · Viền đỏ: trễ hạn · Đường dọc màu cam: hôm nay</div>${Print.signs(['Người lập kế hoạch', 'Quản lý dự án'])}</div>`, { landscape: true, title: 'Gantt ' + pj.ten });
  }
};
function ganttSheet(pj) {
  const vt = pjTasks(pj.id), st = stats(vt); if (!vt.length) return { name: 'Gantt', title: 'BIỂU ĐỒ GANTT', columns: [{ label: 'Công việc' }], rows: [], noFilter: true };
  let a = st.start; const total = D.diff(st.end, a) + 1, byWeek = total > 70, cols = [];
  if (byWeek) { while (D.parse(a).getDay() !== 1) a = D.add(a, -1); for (let d = a; d <= st.end; d = D.add(d, 7)) cols.push(d); } else for (let k = 0; k < total; k++) cols.push(D.add(a, k));
  const span = byWeek ? 7 : 1, today = D.today();
  const rows = vt.map(t => [t.nhom, t.ten, t.person ? t.person.ten : '', t.pct, ...cols.map(d => { const d2 = D.add(d, span - 1); if (t.e < d || t.s > d2) return ''; if (t.ms) return '◆'; const doneEnd = D.add(t.s, Math.round(t.span * t.pct / 100) - 1); return t.pct > 0 && d <= doneEnd ? '█' : '▒'; })]);
  return { name: 'Gantt', title: 'BIỂU ĐỒ GANTT: ' + pj.ten.toUpperCase(), subtitles: [companyLine(), `█ đã làm · ▒ còn lại · ◆ mốc · mỗi cột là 1 ${byWeek ? 'tuần' : 'ngày'}`], freezeCols: 2, noFilter: true,
    columns: [{ label: 'Nhóm', width: 16 }, { label: 'Công việc', width: 34 }, { label: 'Phụ trách', width: 20 }, { label: '% xong', type: 'int', width: 8 }, ...cols.map(d => ({ label: byWeek ? F.date(d).slice(0, 5) : String(D.parse(d).getDate()) + (d === today ? '*' : ''), type: 'center', width: byWeek ? 7 : 3.5 }))], rows };
}
function bindGantt(svg, pj) {
  if (!svg) return; const dw = +svg.dataset.dw, A = svg.dataset.a;
  svg.addEventListener('pointerdown', e => {
    const bar = e.target.closest('[data-bar]'); if (!bar || e.button) return;
    const t = DB.tasks.find(x => x.id === bar.dataset.bar); if (!t) return;
    const view = pjTasks(pj.id).find(x => x.id === t.id);
    const st = { id: t.id, x0: e.clientX, k: 0, moved: false, resize: !!e.target.closest('.h') && svg.dataset.drag === '1', s: view.s, d: +t.days || 0, bar };
    if (svg.dataset.drag !== '1' || view.ms) { st.nodrag = true; }
    const move = ev => {
      const dx = ev.clientX - st.x0; if (Math.abs(dx) > 3) st.moved = true; if (!st.moved || st.nodrag) return;
      st.k = Math.round(dx / dw); bar.classList.add('drag');
      const m = bar.querySelector('.m'), p = bar.querySelector('.p'), h = bar.querySelector('.h'), nm = bar.nextElementSibling, l = bar.querySelector('.l');
      const x0 = D.diff(st.s, A) * dw;
      if (st.resize) { const nd = Math.max(1, st.d + st.k), w = nd * dw, pc = (+t.pct || 0) / 100; m.setAttribute('width', w); p.setAttribute('width', w * pc); if (h) h.setAttribute('x', x0 + w - 6); if (nm) nm.setAttribute('x', x0 + w + 8); }
      else { const tr = `translate(${st.k * dw},0)`; bar.setAttribute('transform', tr); if (nm) nm.setAttribute('transform', tr); }
    };
    const up = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      bar.classList.remove('drag');
      if (!st.moved || st.nodrag) { taskForm(t); return; }
      if (st.k === 0) { App.render(); return; }
      if (st.resize) t.days = Math.max(1, st.d + st.k); else t.start = D.add(st.s, st.k);
      App.changed(); toast(st.resize ? `Đã đổi thời gian còn <b>${t.days} ngày</b>` : `Đã dời việc sang ngày <b>${F.date(t.start)}</b>`, 'ok');
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    e.preventDefault();
  });
}

async function delProj(id) { const p = pjById(id), n = DB.tasks.filter(t => t.pid === id).length; if (!(await Modal.confirm(`Xóa dự án <b>${esc(p.ten)}</b> cùng ${n} công việc bên trong?`, { ok: 'Xóa dự án', danger: true }))) return; DB.tasks = DB.tasks.filter(t => t.pid !== id); DB.projects = DB.projects.filter(x => x.id !== id); App.changed(); }
